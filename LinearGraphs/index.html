<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" type="text/css" href="style.css?v=2">

  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="main-container">
  <div class="banner">
    <b>Επιμέλεια: Ρεβολίδης Παναγιώτης</b></div>
<div class="main-panel">

  <div class="control-panel">
    <b id="title">Ευθύγραμμες κινήσεις - Διαγράμματα.</b>
    <div class="slidecontainer">
    <p id="ampText">Επιτάχυνση: 0 m/s²</p>
  <input type="range" min="-5" max="5" value="0" class="slider" step="0.1" id="amp">
    <p id="fText">Ταχύτητα: 1m/s</p>
    <input type="range" min="-5" max="5" value="1" class="slider" step="0.01" id="f">
     <p id="ΤText">Χρόνική διάρκεια: 10s</p>
    <input type="range" min="0" max="10" value="10" class="slider" step="0.01" id="T">
  
  
</div>    

<button id="restart">Εκκίνηση</button>
</div>

    <div id="sketch-container">

<div id="charts-container">

    <div id="myChartWrapper" class="chart-wrapper">
        <canvas id="myChart"></canvas>
    </div>

    <div id="uChartWrapper" class="chart-wrapper">
        <canvas id="uChart"></canvas>
    </div>

    <div id="xChartWrapper" class="chart-wrapper">
        <canvas id="xChart"></canvas>
    </div>

</div>

<div id="tool-window" class="closed">
    
    <div id="tool-header">
        🔧
    </div>
<div id="tool-window" class="closed">
 
  <div id="tool-header">
    🔧
  </div>

  <div id="tool-body">
        <label><input id="rotCheck" type="checkbox"checked="true">Μετατόπιση.</label>
     <label><input id="xCheck" type="checkbox">Ταχύτητα.</label>
         <label><input id="dCheck" type="checkbox">Επιτάχυνση.</label>
      <label><input id="aCheck" type="checkbox">Διάγραμμα α-t.</label>
           <label><input id="uCheck" type="checkbox">Διάγραμμα u-t.</label>
            <label><input id="xCheck1" type="checkbox">Διάγραμμα x-t.</label>


  </div>

</div>

</div>
    </div>
</div>

</div>

<script src="Preamble.js"></script>
<script src="graphics.js"></script>
<script src="axis.js"></script>
<script src="physicsMath.js"></script>
<script src="sketch.js"></script>
</body>

</html>
