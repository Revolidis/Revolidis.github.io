<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Φθίνουσα Ταλάντωση</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
   <img src="logo2.png" alt="Logo" class="app-logo">
  


</header>

<h1>Φθίνουσα Ταλάντωση</h1>

<div class="controls-row">
  <!-- All your sliders here, IDs match your JS -->
  <fieldset>
    <legend>Πλάτος</legend>
    <input type="range" id="amplitudeSlider" min="1" max="50" value="2">
    <input type="number" id="amplitudeInput" min="1" max="50" value="2">
  </fieldset>
  <fieldset>
    <legend>Συχνότητα</legend>
    <input type="range" id="frequencySlider" min="0.1" max="2" step="0.01" value="0.5">
    <input type="number" id="frequencyInput" min="0.1" max="2" step="0.01" value="0.5">
  </fieldset>
  <fieldset>
    <legend>Συντελεστής Απόσβεσης</legend>
    <input type="range" id="dampingSlider" min="0" max="0.1" step="0.001" value="0.01">
    <input type="number" id="dampingInput" min="0" max="0.1" step="0.001" value="0.01">
  </fieldset>
  <fieldset>
    <legend>Αρχική Φάση</legend>
    <input type="range" id="phaseSlider" min="0" max="6.283" step="0.01" value="0">
    <input type="number" id="phaseInput" min="0" max="6.283" step="0.01" value="0">
  </fieldset>

  <div class="simulation-controls">
      <div class="vector-controls">

  <button id="startPauseBtn">Έναρξη</button>
</div>


      
  </div>
</div>

<div class="main-row">
        <div class="vector-controls">
            <button id="togglePosVec">Διάνυσμα Θέσης</button>
  <button id="toggleVelVec">Διάνυσμα Ταχύτητας</button>
  <button id="toggleAccVec">Διάνυσμα Επιτάχυνσης</button>
    </div>
  <div class="simulation-container">
      
    <canvas id="shmCanvas" width="500" height="250"></canvas>
<div class="values-container">
    <div class="realtime-values-left">
      <div class="value-box"><span class="label">A =</span> <span id="ampValue">0</span> <span class="label">m</span></div>
      <div class="value-box"><span class="label">ω =</span> <span id="omegaValue">0</span> <span class="label">rad/s</span></div>
      <div class="value-box"><span class="label">T =</span> <span id="periodValue">0</span> <span class="label">s</span></div>
      <div class="value-box"><span class="label">f =</span> <span id="freqValue">0</span> <span class="label">hz</span></div>
    
      </div>
          <div class="realtime-values-left">
            <div class="value-box"><span class="label">t =</span> <span id="timeValue">0</span> <span class="label">s</span></div>
            <div class="value-box"><span class="label">x =</span> <span id="posValue">0</span> <span class="label">m</span></div>
            <div class="value-box"><span class="label">v =</span> <span id="velValue">0</span> <span class="label">m/s</span></div>
            <div class="value-box"><span class="label">a =</span> <span id="accValue">0</span> <span class="label">m/s²</span></div>
    
      </div>
      </div>
      
  </div>

  <div class="charts-section">
    <div class="chart-controls">
      <button id="togglePosition">Διάγραμμα x = f(t)</button>
      <button id="toggleVelocity">Διάγραμμα u = f(t)</button>
      <button id="toggleAcceleration">Διάγραμμα α = f(t)</button>
    </div>


    <div id="positionChartContainer">
      <canvas id="positionChart"></canvas>
      <button id="toggleChartMode">Εναλλαγή Γραφήματος</button>
    </div>

    <div id="velocityChartContainer">
      <canvas id="velocityChart"></canvas>
    </div>

    <div id="accelerationChartContainer">
      <canvas id="accelerationChart"></canvas>
    </div>
  </div>
    
</div>

<script src="script.js"></script>
   <div class ="creator2">Επιμέλεια: Ρεβολίδης Παναγιώτης</div> 
</body>
    
</html>
