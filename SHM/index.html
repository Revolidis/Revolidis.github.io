<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" type="text/css"
href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
</head>
<body>

<div class="main-container">
  <div class="banner">
    <b>Επιμέλεια: Ρεβολίδης Παναγιώτης</b></div>
<div class="main-panel">

  <div class="control-panel">
    <b id="title">Περιστρεφόμενο Διάνυσμα.</b>
    <div class="slidecontainer">
    <p id="ampText">Πλάτος: 5m</p>
  <input type="range" min="0" max="10" value="5" class="slider" step="0.1" id="amp">
    <p id="fText">Συχνότητα: 1hz</p>
    <input type="range" min="0" max="5" value="1" class="slider" step="0.01" id="f">
  <p id="phaseText">Αρχική φάση: 0 rad</p>
  <input type="range" min="0" max="6.29" value="0" class="slider" step="0.39269908169" id="phaseSlider">
  
</div>    
<label id="fieldLabel">Πεδίο ορισμού.</label>  
    <div id="text-input">
      
      <label for="quantity">x<sub>1</sin>:</label>
<input type="number" id="x1" name="x1" min="1" max="5">
      <label for="quantity">x<sub>2</sin>:</label>
<input type="number" id="x2" name="x2" min="1" max="5">
    </div>
<button id="restart">Εκκίνηση</button>
</div>

    <div id="sketch-container">
<div id="tool-window" class="closed">

  <div id="tool-header">
    🔧
  </div>

  <div id="tool-body">
    <label ><input id="rotCheck" type="checkbox"> Περιστρεφόμενο Διάνυσμα</label>
    <label><input id="sinCheck" type="checkbox"> Ημίτονο</label>
  </div>

</div>
</div>
    </div>
</div>

</div>

<script src="Preamble.js"></script>
<script src="graphics.js"></script>
<script src="axis.js"></script>
<script src="physicsMath.js"></script>
<script src="sketch.js"></script>
</body>

</html>
